name: Assign leads to online agents

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: read

jobs:
  assign-rto:
    # Skipped on the schedule trigger as of 2026-08-13: this job moved to AWS Lambda +
    # EventBridge Scheduler (see lambda/README.md), which now runs it every 5 minutes
    # instead. Running both here and there on the same schedule would race two
    # independent processes deciding lead assignments against the same live sheet/DB -
    # exactly what assign_leads.py's own docstring says a single-process design avoids.
    # workflow_dispatch is left working (github.event_name is 'workflow_dispatch', not
    # 'schedule') as a manual fallback - e.g. if the Lambda needs to be paused.
    #
    # assign-ndr below now has the same skip - it moved to Lambda too, see
    # lambda/README.md's Status section.
    if: github.event_name != 'schedule'
    runs-on: self-hosted
    concurrency:
      group: assign-leads
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assign unassigned leads
        env:
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          # For the GoKwik already-refunded check: MySQL resolves sheet Order IDs to
          # GoKwik's platformOrderIds (Item_level_data), then these per-vendor credentials
          # call GoKwik itself. See resolve_refund_statuses in assign_leads.py.
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          GOKWIK_HYPHEN_APPID: ${{ secrets.GOKWIK_HYPHEN_APPID }}
          GOKWIK_HYPHEN_APPSECRET: ${{ secrets.GOKWIK_HYPHEN_APPSECRET }}
          GOKWIK_FIEN_APPID: ${{ secrets.GOKWIK_FIEN_APPID }}
          GOKWIK_FIEN_APPSECRET: ${{ secrets.GOKWIK_FIEN_APPSECRET }}
          GOKWIK_MCAFFEINE_APPID: ${{ secrets.GOKWIK_MCAFFEINE_APPID }}
          GOKWIK_MCAFFEINE_APPSECRET: ${{ secrets.GOKWIK_MCAFFEINE_APPSECRET }}
        # -u (unbuffered): without it Python block-buffers stdout when it isn't a terminal, so
        # every line of this script's progress output flushed at once when the process exited -
        # giving every log line the same timestamp and making it impossible to tell from a slow
        # run WHICH phase was slow. That cost real time diagnosing the 8-13 minute runs.
        run: python -u scripts/assign_leads.py

  assign-ndr:
    # Skipped on the schedule trigger as of 2026-08-13, same reasoning and same pattern
    # as assign-rto above: this job moved to AWS Lambda + EventBridge Scheduler (see
    # lambda/README.md). workflow_dispatch stays working as a manual fallback.
    if: github.event_name != 'schedule'
    runs-on: self-hosted
    concurrency:
      group: assign-ndr-leads
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assign unassigned NDR leads
        env:
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: python -u scripts/assign_ndr_leads.py
