name: Refresh reports

on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC = 2:00 PM IST, daily
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write
  id-token: write   # lets this workflow request an OIDC token to assume the AWS role below - no stored AWS keys anywhere

concurrency:
  group: refresh-reports
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: pip install -r requirements.txt

      - name: Regenerate reports from Google Sheets
        shell: pwsh
        env:
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
        run: |
          if (-not $env:GOOGLE_SA_KEY_JSON) {
            throw "Missing repository secret GOOGLE_SA_KEY (paste the service-account JSON there)."
          }
          if (-not $env:MYSQL_HOST -or -not $env:MYSQL_USER -or -not $env:MYSQL_PASSWORD -or -not $env:MYSQL_DATABASE) {
            throw "Missing MYSQL_HOST/MYSQL_USER/MYSQL_PASSWORD/MYSQL_DATABASE repository secrets - needed for the mCaffeine/Hyphen Agent/AI CSAT charts (sourced from mcaff_dwh)."
          }
          # The "Refresh data now" button on the site calls workflow_dispatch; the daily
          # 2 PM IST cron fires as a schedule event. Only the button gets the quick path
          # (last ~30 days of the primary sheet; secondary sheet/small tabs reused from cache).
          $quickArgs = @()
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            Write-Host "Manual trigger - running a quick refresh (last 30 days of the primary sheet only)."
            $quickArgs = @('--quick')
          }
          python ./scripts/refresh.py @quickArgs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::157320387454:role/github-actions-mcaff-cls-deploy
          aws-region: ap-south-1

      - name: Upload reports to S3
        shell: pwsh
        # The report HTML/raw CSVs used to be committed to git purely to trigger a
        # Vercel redeploy - now that api/report/[card].js and api/report/raw.js read
        # these straight from S3 (see api/_lib/s3.js), they go there directly instead.
        # Uploaded on every run regardless of whether the data-cache JSONs below
        # changed, since the reports themselves are always freshly regenerated.
        run: |
          if (Test-Path "api/_reports/mcaffeine.html") {
            aws s3 cp api/_reports/mcaffeine.html s3://mcaff-cls-reports/reports/mcaffeine.html --content-type "text/html; charset=utf-8"
          }
          if (Test-Path "api/_reports/hyphen.html") {
            aws s3 cp api/_reports/hyphen.html s3://mcaff-cls-reports/reports/hyphen.html --content-type "text/html; charset=utf-8"
          }
          Get-ChildItem -Path api/_reports -Filter "*_raw_*.csv.gz" -ErrorAction SilentlyContinue | ForEach-Object {
            aws s3 cp $_.FullName "s3://mcaff-cls-reports/reports/$($_.Name)" --content-type "application/gzip"
          }

      - name: Commit & push if changed
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Just the data-cache JSONs now - the report HTML/raw CSVs above go to S3, not
          # git, so this commit is purely the pipeline's own incremental-refresh state,
          # not anything that needs to trigger a redeploy (see deploy.yml's path filter).
          $paths = @(
            "data/mcaffeine_primary_cache.json", "data/hyphen_primary_cache.json",
            "data/mcaffeine_secondary_cache.json",
            "data/mcaffeine_smalltabs_cache.json", "data/hyphen_smalltabs_cache.json",
            "data/mcaffeine_awb_geo_cache.json", "data/hyphen_awb_geo_cache.json",
            "data/mcaffeine_geo_orders_cache.json", "data/hyphen_geo_orders_cache.json"
          ) | Where-Object { Test-Path $_ }
          git add $paths
          $changed = git status --porcelain $paths
          if ($changed) {
            $stamp = (Get-Date).ToUniversalTime().AddHours(5.5).ToString('yyyy-MM-dd HH:mm')
            git commit -m "Auto-refresh reports ($stamp IST)"

            # This repo gets pushed to frequently from elsewhere while this job is
            # busy regenerating reports (a few minutes), so a bare `git push` here
            # regularly loses the race with a non-fast-forward rejection even though
            # generation succeeded. Rebase onto the latest main and retry instead of
            # failing the whole run - the files this job touches are data/report
            # outputs that don't overlap with unrelated code changes, so a rebase
            # conflict here would be exceptional, not expected.
            $pushed = $false
            for ($i = 1; $i -le 5 -and -not $pushed; $i++) {
              git push
              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
              } else {
                Write-Host "Push rejected (attempt $i/5) - fetching and rebasing onto latest main..."
                git fetch origin main
                git rebase origin/main
                if ($LASTEXITCODE -ne 0) {
                  throw "Rebase onto origin/main failed after a push rejection - needs manual resolution."
                }
              }
            }
            if (-not $pushed) {
              throw "Failed to push after 5 attempts - main is moving too fast to catch up."
            }
            Write-Host "Pushed refreshed reports."
          } else {
            Write-Host "No data changes; nothing to commit."
          }
