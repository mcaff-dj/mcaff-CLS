name: Refresh reports

on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC = 2:00 PM IST, daily
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: refresh-reports
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: pip install -r requirements.txt

      - name: Regenerate reports from Google Sheets
        shell: pwsh
        env:
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if (-not $env:GOOGLE_SA_KEY_JSON) {
            throw "Missing repository secret GOOGLE_SA_KEY (paste the service-account JSON there)."
          }
          # The "Refresh data now" button on the site calls workflow_dispatch; the daily
          # 2 PM IST cron fires as a schedule event. Only the button gets the quick path
          # (last ~30 days of the primary sheet; secondary sheet/small tabs reused from cache).
          $quickArgs = @()
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            Write-Host "Manual trigger - running a quick refresh (last 30 days of the primary sheet only)."
            $quickArgs = @('--quick')
          }
          python ./scripts/refresh.py @quickArgs

      - name: Commit & push if changed
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $paths = @(
            "api/_reports/mcaffeine.html", "api/_reports/hyphen.html",
            "data/mcaffeine_primary_cache.json", "data/hyphen_primary_cache.json",
            "data/mcaffeine_secondary_cache.json",
            "data/mcaffeine_smalltabs_cache.json", "data/hyphen_smalltabs_cache.json"
          ) | Where-Object { Test-Path $_ }
          git add $paths
          $changed = git status --porcelain $paths
          if ($changed) {
            $stamp = (Get-Date).ToUniversalTime().AddHours(5.5).ToString('yyyy-MM-dd HH:mm')
            git commit -m "Auto-refresh reports ($stamp IST)"
            git push
            Write-Host "Pushed refreshed reports."
          } else {
            Write-Host "No data changes; nothing to commit."
          }
