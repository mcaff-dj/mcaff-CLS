name: Sync NDR leads to sheet

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST daily (IST = UTC+5:30) - NDR pulls exactly
                            # yesterday's leads once a day, not a rolling window; see
                            # ndr_source.py's docstring
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-ndr-leads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync NDR leads
        env:
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
        run: python -u scripts/sync_ndr_leads_to_sheet.py
