name: Diag - dump agent_presence

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dump agent_presence
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: python scripts/_diag_agent_presence.py
