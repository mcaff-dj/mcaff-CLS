name: Backfill Created-At-outage gap (one-off)

# One-off: recovers tickets resolved 2026-08-25 09:04 UTC -> 2026-08-27
# 05:48 UTC, which export-resolved-tickets.yml quarantined and permanently
# skipped (its sliding window advances every run regardless of quarantine
# outcome) while FlowCall's Created At format change went unhandled. Delete
# this file once it's been run successfully.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill mcaffeine gap
        run: python scripts/backfill_gap_cleaned.py --api-token "${{ secrets.FLOWCALL_TOKEN_MCAFFEINE }}" --tab-name mcaffeine --gap-start 2026-08-25T09:04:32.710Z --gap-end 2026-08-27T05:47:58.822Z

      - name: Backfill hyphen gap
        run: python scripts/backfill_gap_cleaned.py --api-token "${{ secrets.FLOWCALL_TOKEN_HYPHEN }}" --tab-name hyphen --gap-start 2026-08-25T09:04:44.857Z --gap-end 2026-08-27T05:48:29.543Z

      - name: Push mcaffeine to dashboard
        run: python scripts/push_mcaffeine_to_dashboard.py

      - name: Push hyphen to dashboard
        run: python scripts/push_hyphen_to_dashboard.py
