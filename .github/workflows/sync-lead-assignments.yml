name: Sync calling CRM data to MySQL

on:
  # schedule disabled 2026-08-13: this job moved to AWS Lambda + EventBridge Scheduler
  # (see lambda/README.md) - runs daily there instead, at zero GitHub Actions cost.
  # workflow_dispatch is kept as a manual fallback.
  # schedule:
  #   - cron: '30 3 * * *'   # 9:00am IST daily (3:30 UTC)
  workflow_dispatch: {}      # manual "Run workflow" button - fallback only, not routine

permissions:
  contents: read

concurrency:
  group: sync-calling-crm-to-mysql
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # lead_assignments no longer syncs Postgres -> MySQL here: it moved OFF Postgres onto
      # MySQL CLS_RTO_calling directly (assign_leads.py and api/_lib/db.js both write/read
      # MySQL now - see migrate_cls_rto_calling_schema.py / migrate_lead_assignments_to_cls_rto_calling.py),
      # so there is nothing left for a daily sync to do.
      - name: Sync new agent presence log rows
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
        run: python scripts/sync_agent_presence_log_to_mysql.py
