name: Deploy

# Fires on every push to main that touches the API Lambda's own code or its
# dependencies. Deliberately does NOT fire on changes to data/*.json (refresh.yml's
# own cache bookkeeping) or the generated report HTML (those go straight to S3 from
# refresh.yml, not through this workflow) - so the daily automated data refresh
# doesn't cause a pointless same-code redeploy every day, while any real code
# change - from anyone - deploys within about a minute of landing on main, with no
# manual step. The app/ frontend is NOT deployed by this workflow at all - it's
# hosted separately on AWS Amplify, which has its own GitHub-triggered build.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write   # lets this workflow request an OIDC token to assume the AWS role below - no stored AWS keys anywhere
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Package the Lambda function
        # node_modules now also contains next/react/tailwindcss (the Next.js
        # frontend's dependencies, listed in the same package.json for Amplify's own
        # build to use) - the Lambda's own code never requires() any of these, so
        # they're pruned before zipping rather than shipped as dead weight in every
        # deploy (Next.js alone is a large chunk of a typical node_modules).
        run: |
          mkdir -p build/api
          cp -r api/. build/api/
          rm -rf build/api/_reports
          cp -r node_modules build/node_modules
          rm -rf build/node_modules/next build/node_modules/@next build/node_modules/react build/node_modules/react-dom \
                 build/node_modules/canvas-confetti build/node_modules/tailwindcss build/node_modules/postcss \
                 build/node_modules/autoprefixer build/node_modules/styled-jsx build/node_modules/@swc \
                 build/node_modules/caniuse-lite build/node_modules/bowser
          cp package.json build/package.json
          cd build && zip -r ../lambda.zip . -x "*.git*" && cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::157320387454:role/github-actions-mcaff-cls-deploy
          aws-region: ap-south-1

      # --query restricts the printed output to non-secret fields only. The full response
      # includes Environment.Variables in PLAINTEXT (MYSQL_*, DB_SECRET_NAME, every OAuth
      # secret this Lambda holds) - GitHub only auto-masks a value if it's referenced via
      # secrets.X in THIS workflow, which none of these are, so the unrestricted response
      # this workflow was printing until now put every one of those secrets straight into a
      # log the whole team can read. Same class of leak as deploy-cron-lambdas.yml's 2026-08-14
      # incident (see lambda/README.md) - that workflow got the fix, this one was missed.
      - name: Update Lambda function code
        # The wait below is a courtesy, not the actual deploy - update-function-code above is
        # what pushes the new code, and it already succeeded by the time this runs. The wait
        # polls lambda:GetFunctionConfiguration, a permission this role doesn't always carry
        # (2026-08-29: AccessDeniedException on that action turned a real, successful code
        # push into a red, exit-255 job) - so a missing-permission failure here is treated the
        # same non-fatal way the timeout step below already treats its own missing permission:
        # warn, don't fail. The new code is live either way; only the "wait for it to finish
        # updating" confirmation is skipped.
        run: |
          aws lambda update-function-code --function-name mcaff-cls-api --zip-file fileb://lambda.zip \
            --query "{FunctionName:FunctionName,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}"
          aws lambda wait function-updated --function-name mcaff-cls-api \
            || echo "::warning::Could not confirm the Lambda finished updating (likely missing lambda:GetFunctionConfiguration on the deploy role) - the code push above already succeeded regardless."

      # Safety margin, not a fix for the real cause (see db.js's schemaLooksComplete() -
      # 2026-08-28 timeout incident): a concurrent cold-start bootstrap burst right after a
      # redeploy can still legitimately take longer than 20s on a slow connection. 45s gives
      # a genuinely slow cold start room to finish instead of dying mid-request; reserved
      # concurrency is unrelated here (this Lambda serves live user traffic, unlike the cron
      # workers), so no change to that.
      #
      # Non-fatal: if the deploy role lacks lambda:UpdateFunctionConfiguration this prints
      # what to grant rather than turning a working code deploy red.
      - name: Ensure API Lambda timeout
        run: |
          if aws lambda update-function-configuration --function-name mcaff-cls-api \
               --timeout 45 \
               --query "{FunctionName:FunctionName,Timeout:Timeout}"; then
            aws lambda wait function-updated-v2 --function-name mcaff-cls-api \
              || aws lambda wait function-updated --function-name mcaff-cls-api || true
          else
            echo "::warning::Could not set timeout on mcaff-cls-api - grant lambda:UpdateFunctionConfiguration to the deploy role, or set 45s in the console."
          fi
