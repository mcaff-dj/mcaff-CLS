name: Export resolved tickets

on:
  schedule:
    - cron: '7 */2 * * *'   # every 2 hours, offset 7 min past to avoid the top-of-hour rush
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: export-resolved-tickets
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export hyphen
        env:
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY }}
        run: python scripts/export_recurring.py --api-token "${{ secrets.FLOWCALL_TOKEN_HYPHEN }}" --tab-name hyphen

      - name: Export mcaffeine
        env:
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY }}
        run: python scripts/export_recurring.py --api-token "${{ secrets.FLOWCALL_TOKEN_MCAFFEINE }}" --tab-name mcaffeine

      - name: Commit state file if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resolved-ticket-export-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update export state ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # A manual "Re-run jobs" click reuses the ORIGINAL stale checkout,
            # not latest main - if main has moved since (e.g. this same run
            # already pushed once), a plain push is rejected as a non-fast-
            # forward. Rebase onto the latest main and retry a few times
            # instead of failing outright.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push attempt $attempt failed - fetching and rebasing onto latest main"
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
          else
            echo "No state change; nothing to commit."
          fi
