name: Sync delivery tickets into Delivery_escalation (MySQL)

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours, on the hour (UTC)
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill from this date (YYYY-MM-DD) through today; leave blank for today only"
        required: false

permissions:
  contents: read

concurrency:
  group: sync-delivery-tickets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync HYPHEN tickets
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
        run: python scripts/sync_delivery_tickets_to_sheet.py --tab HYPHEN ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }}

      - name: Sync mCaffeine tickets
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
        run: python scripts/sync_delivery_tickets_to_sheet.py --tab mCaffeine ${{ github.event.inputs.since && format('--since {0}', github.event.inputs.since) || '' }}
