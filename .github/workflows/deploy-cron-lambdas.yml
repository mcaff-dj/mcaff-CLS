name: Deploy cron-job Lambdas

# Fires only when someone actually changes assign-leads' or assign-ndr-leads' own logic
# - a handful of pushes a month, not a schedule. The recurring cadence itself lives on
# EventBridge Scheduler now (see lambda/deploy_infra.sh), not here - that's the whole
# point of this migration (see lambda/README.md): GitHub Actions minutes are only spent
# on an actual code change, never on the recurring invocation.
#
# Rebuilds and redeploys the two live Lambdas whenever any of the paths below change,
# even if only one Lambda's own files were touched - simpler and safer than trying to
# track which paths belong to which function, at the cost of a few extra seconds of
# redundant redeploy.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/assign_leads.py'
      - 'scripts/assign_ndr_leads.py'
      - 'scripts/lib.py'
      - 'scripts/mysql_lib.py'
      - 'scripts/lead_priority.py'
      - 'api/_lib/callingProcesses.json'
      - 'api/_lib/leadAssignmentRules.json'
      - 'lambda/assign_leads/**'
      - 'lambda/assign_ndr_leads/**'
      - 'lambda/csv_upload_worker/**'
      - 'scripts/process_rto_csv_upload_job.py'
      - 'lambda/build.sh'
      # This file too, same as deploy.yml lists itself. Without it a change to the deploy
      # steps below - including the memory/timeout sizing - sits on main doing nothing until
      # some unrelated script happens to change. Shipped exactly that way once; hence the line.
      - '.github/workflows/deploy-cron-lambdas.yml'
  # Lets the sizing/deploy be applied on demand rather than only as a side effect of a code
  # change - e.g. after granting the deploy role a missing IAM permission, where there is no
  # code to push but the configuration still needs to land.
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC -> assume the AWS role below, no stored AWS keys
  contents: read

concurrency:
  group: deploy-cron-lambdas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Lambda zips
        run: |
          sudo apt-get update -y && sudo apt-get install -y zip
          bash lambda/build.sh assign_leads
          bash lambda/build.sh assign_ndr_leads
          bash lambda/build.sh csv_upload_worker

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::157320387454:role/github-actions-mcaff-cls-deploy
          aws-region: ap-south-1

      # --query restricts printed output to non-secret fields only. update-function-code's
      # full response includes Environment.Variables in PLAINTEXT (MYSQL_PASSWORD, every
      # GOKWIK_*_APPSECRET, etc.) - GitHub only auto-masks a value if it's referenced via
      # secrets.X in THIS workflow, which none of these are, so an unrestricted response
      # here would print every one of those secrets straight into a log the whole team can
      # read. Caught in production on 2026-08-14 - see lambda/README.md.
      - name: Update assign-leads Lambda code
        run: |
          aws lambda update-function-code --function-name mcaff-cls-assign-leads \
            --zip-file fileb://lambda/dist/assign_leads.zip \
            --query "{FunctionName:FunctionName,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}"
          aws lambda wait function-updated --function-name mcaff-cls-assign-leads

      - name: Update assign-ndr-leads Lambda code
        run: |
          aws lambda update-function-code --function-name mcaff-cls-assign-ndr-leads \
            --zip-file fileb://lambda/dist/assign_ndr_leads.zip \
            --query "{FunctionName:FunctionName,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}"
          aws lambda wait function-updated --function-name mcaff-cls-assign-ndr-leads

      - name: Update csv-upload-worker Lambda code
        run: |
          aws lambda update-function-code --function-name mcaff-cls-csv-upload-worker \
            --zip-file fileb://lambda/dist/csv_upload_worker.zip \
            --query "{FunctionName:FunctionName,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}"
          aws lambda wait function-updated --function-name mcaff-cls-csv-upload-worker

      # Size, in version control, because it is load-bearing and was invisible.
      #
      # assign-leads was created at 256 MB (lambda/deploy_infra.sh), which is ~0.15 vCPU. Every
      # CPU-bound stage - cold-start imports, the RSA JWT sign, JSON-parsing a ~6 MB sheet, the
      # 15k-row main loop - runs several times slower there than on a full core. Measured on a
      # full core the whole run takes ~14s; throttled that plausibly exceeds the 60s timeout, and
      # a Lambda timeout is a kill, so the run writes nothing and the next one repeats it. That
      # presented four times in two days as "the robot has stopped assigning leads", each time
      # with agents at zero leads and 1,000+ pending, and each time cleared only by running the
      # script by hand off a machine with no timeout.
      #
      # Lambda bills GB-seconds, so ~5x faster at 6x memory is roughly cost-neutral. Timeout goes
      # to 120s to match assign-ndr-leads: enough that a slow run finishes instead of dying, still
      # inside the 5-minute schedule so runs cannot stack (reserved concurrency is 1 regardless).
      #
      # --query for the same reason as the code updates above: this call's full response includes
      # Environment.Variables in PLAINTEXT (MYSQL_PASSWORD, every GOKWIK_*_APPSECRET), and none of
      # them are `secrets.X` in this workflow so GitHub would not mask them. See the 2026-08-14
      # incident note in lambda/README.md.
      #
      # Non-fatal: if the deploy role lacks lambda:UpdateFunctionConfiguration this prints what to
      # grant rather than turning a working code deploy red. Check the log if a run still times out.
      - name: Ensure cron Lambda sizing (memory/timeout)
        run: |
          for fn in mcaff-cls-assign-leads mcaff-cls-assign-ndr-leads; do
            if aws lambda update-function-configuration --function-name "$fn" \
                 --memory-size 1536 --timeout 120 \
                 --query "{FunctionName:FunctionName,MemorySize:MemorySize,Timeout:Timeout}"; then
              aws lambda wait function-updated-v2 --function-name "$fn" \
                || aws lambda wait function-updated --function-name "$fn" || true
            else
              echo "::warning::Could not set memory/timeout on $fn - grant lambda:UpdateFunctionConfiguration to the deploy role, or set 1536 MB / 120 s in the console."
            fi
          done
