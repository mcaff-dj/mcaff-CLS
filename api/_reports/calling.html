    function b64url(s){return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
    function b64urlBytes(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
    async function importPK(pem){const b=pem.replace(/-----BEGIN PRIVATE KEY-----|-----END PRIVATE KEY-----|\s/g,'');const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));return crypto.subtle.importKey('pkcs8',bin.buffer,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']);}

    let _tok=null,_exp=0;
    async function getAccessToken(){
      const now=Math.floor(Date.now()/1000);
      if(_tok&&_exp>now+60)return _tok;
      const h=b64url(JSON.stringify({alg:'RS256',typ:'JWT'}));
      const p=b64url(JSON.stringify({iss:SERVICE_ACCOUNT.client_email,scope:SERVICE_ACCOUNT.scopes,aud:SERVICE_ACCOUNT.token_uri,iat:now,exp:now+3600}));
      const u=`${h}.${p}`;const k=await importPK(SERVICE_ACCOUNT.private_key);
      const sig=await crypto.subtle.sign('RSASSA-PKCS1-v1_5',k,new TextEncoder().encode(u));
      const jwt=`${u}.${b64urlBytes(sig)}`;
      const r=await fetch(SERVICE_ACCOUNT.token_uri,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`});
      const d=await r.json();if(!d.access_token)throw new Error(d.error_description||'Token error');
      _tok=d.access_token;_exp=now+3500;return _tok;
    }

    async function fetchSheet(sid,range='Data'){
      const t=await getAccessToken();
      const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(range)}?majorDimension=ROWS`,{headers:{Authorization:`Bearer ${t}`}});
      if(!r.ok)throw new Error(`Sheets API ${r.status}`);const d=await r.json();
      if(!d.values||d.values.length<2)throw new Error('No data');return d.values;
    }

    function extractSheetId(i){const m=i.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:/^[a-zA-Z0-9_-]{20,}$/.test(i.trim())?i.trim():null;}

    function parseDate(s){if(!s)return null;let d=new Date(s);if(!isNaN(d))return d;const p=s.trim().split(/\s+/);if(p.length===2){const day=parseInt(p[0]),ms=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'],mi=ms.indexOf(p[1].toLowerCase().slice(0,3));if(!isNaN(day)&&mi!==-1)return new Date(new Date().getFullYear(),mi,day);}return null;}

    /* ── Non-blocking parser ─────────────────────────── */
    async function parseRows(vals, user=null, role='Admin'){
      if(!vals||vals.length<2)return[];
      const[hdr,...rows]=vals;
      const aE=(user?.email||'').toLowerCase(),aP=aE.split('@')[0],aF=(user?.name||'').toLowerCase().split(' ')[0];
      const res=[];
      for(let i=0;i<rows.length;i++){
        const r=rows[i];
        const ag=(r[16]||'').toLowerCase().trim();
        if(role==='Agent'&&user&&ag&&ag!=='unassigned'){
          if(!(aE&&ag===aE)||(aP.length>2&&ag.includes(aP))||(aF.length>2&&ag.includes(aF)))
            if(ag!==aE&&!ag.includes(aP)&&!ag.includes(aF))continue;
        }
        const o={};hdr.forEach((h,x)=>{const c=(h||'').trim();if(c)o[c]=(r[x]||'').trim();o[`c${x}`]=(r[x]||'').trim();});
        res.push(mapTkt(o,i));
        if(i%5000===4999)await new Promise(r=>setTimeout(r,0));
      }
      return res;
    }

    function mapTkt(r,i){
      const g=(...ks)=>{for(const k of ks){const f=Object.keys(r).find(h=>h.toLowerCase().replace(/[^a-z0-9]/g,'').includes(k.toLowerCase().replace(/[^a-z0-9]/g,'')));if(f&&r[f])return r[f];}return'';};
      const pay=g('Payment Method','Payment Mode','Payment','Type').toUpperCase();
      const amt=g('Order Amount','Amount','Price','Total','Order Value');
      const ord=g('Order Number','Order #','Order ID','OrderNo')||`ORD-${i+1000}`;
      const agt=g('Agent Name','Agent','Assigned Agent','AgentName','Assigned To','c16')||'Unassigned';
      const rto=g('RTO Reason','c3','Reason','RTOReason')||'Return To Origin';
      const cd=g('Calling Date','CallingDate','c24')||'';
      const prep=pay.includes('PREPAID')||pay.includes('ONLINE')||pay.includes('PAYTM')||pay.includes('UPI')||(!pay.includes('COD')&&!pay.includes('CASH'));
      const hp=prep&&HIGH_PRIORITY_RTO_REASONS.some(x=>rto.toLowerCase().includes(x));
      return{id:`T-${ord}-${i}`,orderNumber:ord,customerName:g('Customer Name','Name','Customer','Full Name')||'Customer',
        email:g('Email ID','Email','Customer Email')||'',phone:g('Contact Number','Phone','Mobile','Contact')||'',
        address:g('Address','Street Address','Shipping Address')||'',city:g('City','District','Town')||'',
        state:g('State','Province')||'',pincode:g('Pincode','Zip','Postal Code','Pin Code')||'',
        paymentMethod:pay.includes('COD')||pay.includes('CASH')?'COD':'Prepaid',
        orderAmount:parseFloat(amt.replace(/[^0-9.]/g,''))||0,rtoReason:rto,
        assignedAgent:agt,callingDate:cd||'—',isHighPriority:hp,
        rowDate:parseDate(cd)||parseDate(g('Date','Order Date','c0')),rawIndex:i,
        status:'Pending',connected:r['c17']||'',disposition:r['c19']||''};
    }

      };

      const [tickets, setTickets] = useState(()=>{try{const s=localStorage.getItem('rto_cache_v4');if(s){const p=JSON.parse(s);if(Array.isArray(p)&&p.length)return p;}}catch{}return[];});

      const showToast = useCallback(m=>{setToast(m);setTimeout(()=>setToast(null),3000);},[]);

      // Modals
      const [detailTkt, setDetailTkt] = useState(null);

        const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        setActivityLogs(p=>[{time:t,agent:googleUser.email,action:`Disposed ${dispTkt.orderNumber} → ${st}`,type:'ticket'},...p.slice(0,49)]);
        if(isRef){doRefund(dispTkt.id,{refundId:`RFD-${Date.now().toString().slice(-6)}`,amount:dispTkt.orderAmount,reason:dispReason,date:new Date().toLocaleString(),mode:dispTkt.paymentMethod==='COD'?'UPI Payout':'Original Gateway',transactionRef:`TXN-${Math.random().toString(36).substring(2,10).toUpperCase()}`,processedBy:googleUser.name,notes:refNotes});}
        else showToast(`Disposition saved for ${dispTkt.orderNumber}`);
        setDispTkt(null);
      };

      const doRefund = (id, rec)=>{
        setOverrides(p=>({...p,[id]:{status:'Refunded',refundDetails:rec}}));
        if(googleUser.email){setStats(p=>{const c=p[googleUser.email]||{resolvedCount:0};const u={...p,[googleUser.email]:{resolvedCount:c.resolvedCount+1,lastResolvedAt:Date.now()}};localStorage.setItem('rto_agent_stats',JSON.stringify(u));return u;});}
        const tgt=tickets.find(t=>t.id===id);
        if(tgt){setReceiptTkt({...tgt,refundDetails:rec});try{window.confetti?.({particleCount:60,spread:55,origin:{y:.7}});}catch{}showToast(`₹${rec.amount.toLocaleString('en-IN')} refunded successfully`);}
      };

      // Sync
      const sync = useCallback(async(silent=false)=>{
        const sid=extractSheetId(DEFAULT_SHEET_URL);if(!sid)return;setIsSyncing(true);
        try{const raw=await fetchSheet(sid,DEFAULT_SHEET_RANGE);const mapped=await parseRows(raw,googleUser,userRole);setTickets(mapped);try{localStorage.setItem('rto_cache_v4',JSON.stringify(mapped.slice(0,10000)));}catch{}setLastSync(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));if(!silent)showToast(`${mapped.length.toLocaleString('en-IN')} leads synced`);}
        catch(e){if(!silent)showToast(e.message);}finally{setIsSyncing(false);}
      },[googleUser,userRole,showToast]);

      useEffect(()=>{sync(true);},[]);
      useEffect(()=>{const t=setInterval(()=>sync(true),60000);return()=>clearInterval(t);},[sync]);

      // Derived data
      const allTickets = useMemo(()=>{
        let base=tickets.map(t=>{const o=overrides[t.id];return o?{...t,status:o.status||t.status,refundDetails:o.refundDetails,connected:o.connectedStatus||t.connected,disposition:o.agentDisposition||t.disposition}:t;});
        base.sort((a,b)=>{if(a.isHighPriority&&!b.isHighPriority)return-1;if(!a.isHighPriority&&b.isHighPriority)return 1;if(a.rowDate&&b.rowDate)return b.rowDate-a.rowDate;return 0;});
        if(userRole==='Agent'){const pend=base.filter(t=>t.status!=='Refunded').slice(0,maxLeads);return[...pend,...base.filter(t=>t.status==='Refunded')];}
        return base;
      },[tickets,overrides,userRole,maxLeads]);

      const hp=allTickets.filter(t=>t.isHighPriority&&t.status!=='Refunded').length;
      const pend=allTickets.filter(t=>t.status!=='Refunded').length;
      const refd=allTickets.filter(t=>t.status==='Refunded').length;

      const agents = useMemo(()=>{const s=new Set();allTickets.forEach(t=>{if(t.assignedAgent&&t.assignedAgent!=='Unassigned')s.add(t.assignedAgent);});agentRoster.forEach(a=>s.add(a.email));return[...s].sort();},[allTickets,agentRoster]);

      const filtered = useMemo(()=>{
        setPage(1);
        return allTickets.filter(t=>{
          if(agentFilter!=='ALL'){const a=t.assignedAgent.toLowerCase(),s=agentFilter.toLowerCase();if(!a.includes(s)&&!s.includes(a))return false;}
          if(tab==='high'&&(!t.isHighPriority||t.status==='Refunded'))return false;
          if(tab==='pending'&&t.status==='Refunded')return false;
          if(tab==='refunded'&&t.status!=='Refunded')return false;
          if(prioFilter==='HIGH'&&!t.isHighPriority)return false;
          if(payFilter!=='ALL'&&t.paymentMethod!==payFilter)return false;
          if(search.trim()){const q=search.toLowerCase();if(![t.orderNumber,t.customerName,t.email,t.phone,t.rtoReason,t.callingDate,t.assignedAgent].some(f=>(f||'').toLowerCase().includes(q)))return false;}
          return true;
        });
      },[allTickets,agentFilter,tab,prioFilter,payFilter,search]);

      const pages=Math.ceil(filtered.length/perPage)||1;
      const visible=filtered.slice((page-1)*perPage,page*perPage);

      const tabs=[
        {key:'all',label:'All Leads',count:allTickets.length},
        {key:'high',label:'High Priority',count:hp},
        {key:'pending',label:'Pending',count:pend},
        {key:'refunded',label:'Refunded',count:refd},
      ];
      if(userRole==='Admin'||userRole==='Team Lead')tabs.push({key:'admin',label:'Admin Panel',count:agentRoster.length});

      return(
        <div className="min-h-screen flex flex-col bg-[#0a0a0b]">

          {/* ═══ HEADER ═══ */}
          <header className="sticky top-0 z-30 bg-[#0a0a0b]/95 backdrop-blur-lg border-b border-zinc-800/70">
            <div className="max-w-[1440px] mx-auto px-5 h-12 flex items-center justify-between gap-3">
              <nav className="flex items-center gap-0.5 overflow-x-auto no-scrollbar">
                {tabs.map(t=>(
                  <button key={t.key} onClick={()=>setTab(t.key)} className={`relative px-3 py-1.5 rounded-md text-[13px] font-medium whitespace-nowrap transition-all ${tab===t.key?'text-white bg-zinc-800':'text-zinc-500 hover:text-zinc-300'}`}>
                    {t.key==='high'&&<span className="mr-1 text-rose-400">●</span>}
                    {t.label}
                    <span className={`ml-1.5 text-[10px] tabular-nums ${tab===t.key?'text-zinc-400':'text-zinc-600'}`}>{t.count.toLocaleString('en-IN')}</span>
                  </button>
                ))}
              </nav>
              <div className="flex items-center gap-2">
                <div className="relative hidden md:block">
                  <SearchIcon className="absolute left-2.5 top-1/2 -translate-y-1/2 text-zinc-500"/>
                  <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search orders, customers…" className="w-48 pl-8 pr-3 py-1.5 text-[13px] bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-200 placeholder:text-zinc-600 focus:outline-none focus:ring-1 focus:ring-indigo-500/50 focus:border-indigo-500/50"/>
                </div>
                <button onClick={()=>sync(false)} disabled={isSyncing} className="h-8 px-3 flex items-center gap-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-[13px] text-zinc-400 hover:text-white transition-colors disabled:opacity-50" title="Refresh data">
                  <RefreshIcon className={isSyncing?'animate-spin text-indigo-400':''}/>
                  <span className="hidden sm:inline">{isSyncing?'Syncing…':'Refresh'}</span>
                </button>
                <div className="h-8 flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 rounded-lg px-2.5">
                  <span className={`h-2 w-2 rounded-full ${agentStatus==='Online'?'bg-emerald-500':agentStatus==='Busy'?'bg-amber-400 pulse-dot':'bg-zinc-500'}`}/>
                  <select value={agentStatus} onChange={e=>handleSetStatus(e.target.value)} className="text-[13px] bg-transparent border-none text-zinc-200 font-medium focus:outline-none cursor-pointer pr-5">
                    <option value="Online" className="bg-zinc-900">Online</option>
                    <option value="Busy" className="bg-zinc-900">On Break</option>
                    <option value="Offline" className="bg-zinc-900">Offline</option>
                  </select>
                </div>
              </div>
            </div>
          </header>

          {/* ═══ TOAST ═══ */}
          {toast&&<div className="fixed top-14 right-5 z-50 animate-slideUp"><div className="px-4 py-2.5 rounded-lg bg-zinc-800 text-zinc-100 border border-zinc-700 text-[13px] shadow-2xl flex items-center gap-2"><CheckIcon className="text-emerald-400 shrink-0"/>{toast}</div></div>}

          {/* ═══ MAIN ═══ */}
          <main className="flex-1 max-w-[1440px] w-full mx-auto px-5 py-5 space-y-4">

            {tab==='admin'&&(userRole==='Admin'||userRole==='Team Lead')?(
              <div className="space-y-5 animate-fadeIn">
                <div><h2 className="text-lg font-bold text-zinc-100">Team Management</h2><p className="text-[13px] text-zinc-500 mt-0.5">Configure roles, lead quotas, and monitor agent activity.</p></div>

                <div className="bg-zinc-900/80 rounded-xl border border-zinc-800 overflow-hidden">
                  <table className="w-full text-[13px]">
                    <thead><tr className="border-b border-zinc-800 text-zinc-500">
                      <th className="py-3 px-4 text-left font-medium">Agent</th>
                      <th className="py-3 px-4 text-left font-medium">Role</th>
                      <th className="py-3 px-4 text-left font-medium">Status</th>
                      <th className="py-3 px-4 text-left font-medium">Avg. Handle Time</th>
                      <th className="py-3 px-4 text-left font-medium">Break Time</th>
                      <th className="py-3 px-4 text-left font-medium">Lead Quota</th>
                      <th className="py-3 px-4 text-right font-medium"></th>
                    </tr></thead>
                    <tbody className="divide-y divide-zinc-800/50">
                      {agentRoster.map(a=>(
                        <tr key={a.email} className="hover:bg-zinc-800/30 transition-colors">
                          <td className="py-3 px-4"><p className="font-semibold text-zinc-100">{a.name}</p><p className="text-zinc-500 text-[12px]">{a.email}</p></td>
                          <td className="py-3 px-4"><select value={a.role} onChange={e=>{setAgentRoster(p=>{const u=p.map(x=>x.email===a.email?{...x,role:e.target.value}:x);localStorage.setItem('rto_agent_roster',JSON.stringify(u));return u;});}} className="text-[13px] bg-zinc-800 border border-zinc-700 rounded-md px-2 py-1 text-indigo-400 font-medium focus:outline-none"><option value="Agent">Agent</option><option value="Team Lead">Team Lead</option><option value="Admin">Admin</option></select></td>
                          <td className="py-3 px-4"><span className={`inline-flex items-center gap-1.5 text-[13px] font-medium ${a.status==='Online'?'text-emerald-400':a.status==='Busy'?'text-amber-400':'text-zinc-500'}`}><span className={`h-1.5 w-1.5 rounded-full ${a.status==='Online'?'bg-emerald-500':a.status==='Busy'?'bg-amber-400':'bg-zinc-500'}`}/>{a.status}</span></td>
                          <td className="py-3 px-4 text-zinc-300 font-mono">{a.aht||'—'}</td>
                          <td className="py-3 px-4 text-zinc-400">{a.breakTime||'—'}</td>
                          <td className="py-3 px-4"><select value={a.maxQuota} onChange={e=>{setAgentRoster(p=>{const u=p.map(x=>x.email===a.email?{...x,maxQuota:+e.target.value}:x);localStorage.setItem('rto_agent_roster',JSON.stringify(u));return u;});}} className="text-[13px] bg-zinc-800 border border-zinc-700 rounded-md px-2 py-1 text-zinc-200 focus:outline-none"><option value="5">5</option><option value="10">10</option><option value="15">15</option><option value="20">20</option></select></td>
                          <td className="py-3 px-4 text-right"><button onClick={()=>{setAgentFilter(a.email);setTab('all');showToast(`Showing ${a.name}'s leads`);}} className="px-3 py-1 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white text-[12px] font-medium transition-colors">View Leads</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                {activityLogs.length>0&&(
                  <div className="bg-zinc-900/80 rounded-xl border border-zinc-800 p-5">
                    <h3 className="text-sm font-semibold text-zinc-200 mb-3">Activity Log</h3>
                    <div className="space-y-1.5 max-h-56 overflow-y-auto">
                      {activityLogs.map((l,i)=>(
                        <div key={i} className="flex items-center justify-between px-3 py-2 rounded-lg bg-zinc-800/30 text-[13px]">
                          <div className="flex items-center gap-2.5"><span className="text-zinc-500 font-mono text-[12px] w-12">{l.time}</span><span className="text-zinc-300 font-medium">{l.agent.split('@')[0]}</span><span className="text-zinc-500">{l.action}</span></div>
                          <Badge color={l.type==='online'?'green':l.type==='break'?'amber':l.type==='ticket'?'blue':'zinc'}>{l.type}</Badge>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            ):(
              <>
                {/* Stats */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                  <div className="bg-zinc-900/80 rounded-xl p-4 border border-zinc-800"><p className="text-[11px] font-medium uppercase tracking-wider text-zinc-500 mb-1">Total Leads</p><p className="text-2xl font-extrabold text-zinc-100 tabular-nums">{filtered.length.toLocaleString('en-IN')}</p><p className="text-[12px] text-zinc-500 mt-1">{agentFilter!=='ALL'?agentFilter:'All agents'}</p></div>
                  <div className="bg-zinc-900/80 rounded-xl p-4 border border-zinc-800"><p className="text-[11px] font-medium uppercase tracking-wider text-zinc-500 mb-1">Avg Handle Time</p><p className="text-2xl font-extrabold text-zinc-100">2.8<span className="text-sm font-normal text-zinc-400 ml-0.5">min</span></p><p className="text-[12px] text-zinc-500 mt-1">Per resolution</p></div>
                  <div className="bg-zinc-900/80 rounded-xl p-4 border border-rose-900/40"><p className="text-[11px] font-medium uppercase tracking-wider text-rose-400 mb-1">High Priority</p><p className="text-2xl font-extrabold text-zinc-100 tabular-nums">{hp.toLocaleString('en-IN')}</p><p className="text-[12px] text-zinc-500 mt-1">Prepaid refusals</p></div>
                  <div className="bg-zinc-900/80 rounded-xl p-4 border border-zinc-800"><p className="text-[11px] font-medium uppercase tracking-wider text-zinc-500 mb-1">Last Synced</p><p className="text-2xl font-extrabold text-zinc-100">{lastSync}</p><p className="text-[12px] text-zinc-500 mt-1">Auto-refresh 60s</p></div>
                </div>

                {/* Filters */}
                <div className="flex items-center justify-between gap-3 flex-wrap">
                  <div className="flex items-center gap-2 flex-wrap">
                    <select value={agentFilter} onChange={e=>setAgentFilter(e.target.value)} className="text-[13px] bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-lg px-2.5 py-1.5 focus:outline-none font-medium cursor-pointer">
                      <option value="ALL">All agents</option>
                      {agents.map(a=><option key={a} value={a}>{a.includes('@')?a.split('@')[0]:a}</option>)}
                    </select>
                    <select value={dateScope} onChange={e=>{setDateScope(e.target.value);localStorage.setItem('rto_date_scope',e.target.value);sync(false,e.target.value);}} className="text-[13px] bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-lg px-2.5 py-1.5 focus:outline-none cursor-pointer">
                      <option value="ALL_TIME">All time</option>
                      <option value="7_DAYS">Last 7 days</option>
                      <option value="30_DAYS">Last 30 days</option>
                    </select>
                    <select value={payFilter} onChange={e=>setPayFilter(e.target.value)} className="text-[13px] bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-lg px-2.5 py-1.5 focus:outline-none cursor-pointer">
                      <option value="ALL">All payments</option>
                      <option value="Prepaid">Prepaid</option>
                      <option value="COD">COD</option>
                    </select>
                  </div>
                  <div className="flex items-center gap-2">
                    <select value={perPage} onChange={e=>setPerPage(+e.target.value)} className="text-[13px] bg-zinc-900 border border-zinc-800 text-zinc-400 rounded-lg px-2.5 py-1.5 focus:outline-none cursor-pointer"><option value="25">25</option><option value="50">50</option><option value="100">100</option></select>
                    <span className="text-[12px] text-zinc-500 tabular-nums">{filtered.length.toLocaleString('en-IN')} results</span>
                  </div>
                </div>

                {/* TABLE */}
                {visible.length===0?(
                  <EmptyState title="No leads found" sub="Try adjusting your filters or search query to find what you're looking for."/>
                ):(
                  <div className="bg-zinc-900/60 rounded-xl border border-zinc-800 overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-[13px]">
                        <thead><tr className="border-b border-zinc-800 text-zinc-500 text-[12px]">
                          <th className="py-2.5 px-4 text-left font-medium">Order</th>
                          <th className="py-2.5 px-4 text-left font-medium">Customer</th>
                          <th className="py-2.5 px-4 text-left font-medium">Agent</th>
                          <th className="py-2.5 px-4 text-left font-medium">Calling Date</th>
                          <th className="py-2.5 px-4 text-left font-medium">RTO Reason</th>
                          <th className="py-2.5 px-4 text-left font-medium">Payment</th>
                          <th className="py-2.5 px-4 text-right font-medium">Amount</th>
                          <th className="py-2.5 px-4 text-center font-medium">Status</th>
                          <th className="py-2.5 px-4 text-right font-medium"></th>
                        </tr></thead>
                        <tbody className="divide-y divide-zinc-800/40">
                          {visible.map(t=>{
                            const ref=t.status==='Refunded';
                            return(
                              <tr key={t.id} className={`hover:bg-zinc-800/20 transition-colors ${t.isHighPriority&&!ref?'bg-rose-950/10':''}`}>
                                <td className="py-2.5 px-4"><span className="font-mono font-semibold text-zinc-200">{t.orderNumber}</span>{t.isHighPriority&&!ref&&<span className="ml-1.5 text-rose-400 text-[10px] font-bold">● HP</span>}</td>
                                <td className="py-2.5 px-4"><span className="text-zinc-200">{t.customerName}</span><span className="block text-[12px] text-zinc-500 mt-0.5 truncate max-w-[160px]">{t.email||t.phone}</span></td>
                                <td className="py-2.5 px-4 text-zinc-400">{t.assignedAgent==='Unassigned'?<span className="text-zinc-600 italic">Unassigned</span>:t.assignedAgent.includes('@')?t.assignedAgent.split('@')[0]:t.assignedAgent}</td>
                                <td className="py-2.5 px-4 text-zinc-400 tabular-nums">{t.callingDate}</td>
                                <td className="py-2.5 px-4 max-w-[200px]"><span className={`truncate block ${t.isHighPriority?'text-rose-300':'text-zinc-400'}`}>{t.rtoReason}</span></td>
                                <td className="py-2.5 px-4"><Badge color={t.paymentMethod==='COD'?'amber':'blue'}>{t.paymentMethod}</Badge></td>
                                <td className="py-2.5 px-4 text-right font-semibold text-zinc-200 tabular-nums">₹{t.orderAmount.toLocaleString('en-IN')}</td>
                                <td className="py-2.5 px-4 text-center"><Badge color={ref?'green':'zinc'}>{ref?'Refunded':'Pending'}</Badge></td>
                                <td className="py-2.5 px-4 text-right"><div className="flex items-center justify-end gap-1">
                                  <button onClick={()=>setDetailTkt(t)} className="px-2 py-1 rounded-md text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 text-[12px] transition-colors">Details</button>
                                  <button onClick={()=>openDisp(t)} className="px-2.5 py-1 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white text-[12px] font-medium flex items-center gap-1 transition-colors"><PhoneIcon/>Call</button>
                                </div></td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                    {pages>1&&(
                      <div className="flex items-center justify-between px-4 py-2.5 border-t border-zinc-800 text-[13px]">
                        <span className="text-zinc-500 tabular-nums">Page {page} of {pages}</span>
                        <div className="flex gap-1"><button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1} className="px-3 py-1 rounded-md bg-zinc-800 text-zinc-300 disabled:opacity-30 font-medium hover:bg-zinc-700 transition-colors">Prev</button><button onClick={()=>setPage(p=>Math.min(pages,p+1))} disabled={page===pages} className="px-3 py-1 rounded-md bg-zinc-800 text-zinc-300 disabled:opacity-30 font-medium hover:bg-zinc-700 transition-colors">Next</button></div>
                      </div>
                    )}
                  </div>
                )}
              </>
            )}
          </main>

          {/* ═══ DISPOSITION MODAL ═══ */}
          {dispTkt&&(
            <Overlay onClose={()=>setDispTkt(null)}>
              <div className="w-full max-w-md bg-[#111113] border border-zinc-800 rounded-2xl shadow-2xl text-zinc-100 p-6 space-y-5">
                <div className="flex items-center justify-between">
                  <div><h3 className="text-base font-bold">Call Disposition</h3><p className="text-[13px] text-zinc-500 mt-0.5"><span className="font-mono text-indigo-400">{dispTkt.orderNumber}</span> · {dispTkt.customerName} · <span className="text-sky-400">{dispTkt.paymentMethod}</span></p></div>
                  <button onClick={()=>setDispTkt(null)} className="p-1 rounded-lg hover:bg-zinc-800 text-zinc-400 transition-colors"><XIcon/></button>
                </div>

                <div className="space-y-4">
                  <div><p className="text-[12px] font-semibold text-zinc-400 uppercase tracking-wide mb-2">Was the call connected?</p>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={()=>{setDispConn('YES');setDispReason('');}} className={`py-3 rounded-xl font-semibold text-[13px] border transition-all ${dispConn==='YES'?'bg-emerald-600 text-white border-emerald-500 shadow-lg shadow-emerald-900/30':'bg-zinc-900 text-zinc-300 border-zinc-700 hover:border-zinc-600'}`}>Yes, connected</button>
                      <button onClick={()=>{setDispConn('NO');setDispReason('');}} className={`py-3 rounded-xl font-semibold text-[13px] border transition-all ${dispConn==='NO'?'bg-rose-600 text-white border-rose-500 shadow-lg shadow-rose-900/30':'bg-zinc-900 text-zinc-300 border-zinc-700 hover:border-zinc-600'}`}>Not reachable</button>
                    </div>
                  </div>

                  {dispConn==='YES'&&(
                    <div className="space-y-3 animate-fadeIn">
                      <div><p className="text-[12px] font-semibold text-zinc-400 uppercase tracking-wide mb-1.5">Call outcome</p>
                        <select value={dispReason} onChange={e=>setDispReason(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-[13px] font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500/50">
                          <option value="">Select outcome…</option>
                          <option value="Refund Requested">Refund Requested</option>
                          <option value="Customer Agreed to Accept">Customer Agreed to Accept</option>
                          <option value="Product Issue / Exchange">Product Issue / Exchange</option>
                          <option value="Address Change Requested">Address Change Requested</option>
                          <option value="Not Interested">Not Interested</option>
                          <option value="Wrong Number">Wrong Number</option>
                        </select>
                      </div>

                      {dispReason==='Refund Requested'&&(
                        <div className="bg-emerald-950/30 p-4 rounded-xl border border-emerald-900/40 space-y-2 animate-fadeIn">
                          <div className="flex items-center justify-between"><span className="font-semibold text-emerald-300">{dispTkt.paymentMethod==='Prepaid'?'Prepaid Refund':'COD Refund'}</span><span className="font-mono text-lg font-bold text-emerald-400">₹{dispTkt.orderAmount.toLocaleString('en-IN')}</span></div>
                          <p className="text-[12px] text-zinc-400">{dispTkt.paymentMethod==='Prepaid'?'Credited to original payment source.':'Credited via UPI payout.'}</p>
                          <input value={refNotes} onChange={e=>setRefNotes(e.target.value)} placeholder="Notes (optional)" className="w-full bg-zinc-900/60 border border-zinc-700 rounded-lg p-2 text-[13px] focus:outline-none"/>
                        </div>
                      )}

                      {(dispReason==='Customer Agreed to Accept'||dispReason==='Product Issue / Exchange')&&(
                        <div className="bg-zinc-900/50 p-3 rounded-xl border border-zinc-800 space-y-2 animate-fadeIn">
                          <p className="text-[12px] font-semibold text-zinc-300">New order required?</p>
                          <div className="flex gap-2"><button onClick={()=>setNewOrder('YES')} className={`flex-1 py-2 rounded-lg text-[13px] font-medium border ${newOrder==='YES'?'bg-indigo-600 text-white border-indigo-500':'bg-zinc-800 text-zinc-300 border-zinc-700'}`}>Yes</button><button onClick={()=>setNewOrder('NO')} className={`flex-1 py-2 rounded-lg text-[13px] font-medium border ${newOrder==='NO'?'bg-zinc-700 text-white border-zinc-600':'bg-zinc-800 text-zinc-300 border-zinc-700'}`}>No</button></div>
                          {newOrder==='YES'&&<input value={newOrderId} onChange={e=>setNewOrderId(e.target.value)} placeholder="New order ID…" className="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-[13px] focus:outline-none"/>}
                        </div>
                      )}

                      {(dispReason==='Customer Agreed to Accept'||dispReason==='Address Change Requested'||dispReason==='Product Issue / Exchange')&&(
                        <div className="bg-zinc-900/50 p-3 rounded-xl border border-zinc-800 space-y-2 animate-fadeIn">
                          <p className="text-[12px] font-semibold text-zinc-300">Address change needed?</p>
                          <div className="flex gap-2"><button onClick={()=>setAddrChange('YES')} className={`flex-1 py-2 rounded-lg text-[13px] font-medium border ${addrChange==='YES'?'bg-indigo-600 text-white border-indigo-500':'bg-zinc-800 text-zinc-300 border-zinc-700'}`}>Yes</button><button onClick={()=>setAddrChange('NO')} className={`flex-1 py-2 rounded-lg text-[13px] font-medium border ${addrChange==='NO'?'bg-zinc-700 text-white border-zinc-600':'bg-zinc-800 text-zinc-300 border-zinc-700'}`}>No</button></div>
                          {addrChange==='YES'&&<textarea value={newAddr} onChange={e=>setNewAddr(e.target.value)} placeholder="New address…" rows="2" className="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-[13px] focus:outline-none resize-none"/>}
                        </div>
                      )}
                    </div>
                  )}

                  {dispConn==='NO'&&(
                    <div className="animate-fadeIn"><p className="text-[12px] font-semibold text-zinc-400 uppercase tracking-wide mb-1.5">Reason</p>
                      <select value={dispReason} onChange={e=>setDispReason(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-[13px] font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500/50">
                        <option value="">Select reason…</option>
                        <option value="Ringing / No Answer">Ringing / No Answer</option>
                        <option value="Not Reachable">Not Reachable</option>
                        <option value="Switch Off">Switched Off</option>
                        <option value="Line Busy">Line Busy</option>
                        <option value="Invalid Number">Invalid Number</option>
                      </select>
                    </div>
                  )}
                </div>

                <div className="flex items-center justify-end gap-2 pt-2 border-t border-zinc-800">
                  <button onClick={()=>setDispTkt(null)} className="px-4 py-2 rounded-lg text-[13px] text-zinc-400 hover:text-zinc-200 transition-colors">Cancel</button>
                  <button onClick={submitDisp} disabled={!dispConn||!dispReason} className={`px-5 py-2 rounded-lg font-semibold text-[13px] disabled:opacity-30 transition-all ${dispReason==='Refund Requested'?'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-900/20':'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-900/20'}`}>
                    {dispReason==='Refund Requested'?'Confirm Refund':'Submit'}
                  </button>
                </div>
              </div>
            </Overlay>
          )}

          {/* ═══ DETAIL MODAL ═══ */}
          {detailTkt&&(
            <Overlay onClose={()=>setDetailTkt(null)}>
              <div className="w-full max-w-md bg-[#111113] border border-zinc-800 rounded-2xl shadow-2xl text-zinc-100">
                <div className="flex items-center justify-between px-6 py-4 border-b border-zinc-800">
                  <h3 className="text-base font-bold font-mono">{detailTkt.orderNumber}</h3>
                  <button onClick={()=>setDetailTkt(null)} className="p-1 rounded-lg hover:bg-zinc-800 text-zinc-400"><XIcon/></button>
                </div>
                <div className="px-6 py-5 space-y-4 max-h-[65vh] overflow-y-auto text-[13px]">
                  {detailTkt.isHighPriority&&<div className="p-3 rounded-xl bg-rose-950/30 border border-rose-900/40 text-rose-300 font-medium text-[13px]">High Priority — Prepaid refusal match</div>}
                  <div className="grid grid-cols-2 gap-4">
                    <div><p className="text-[11px] text-zinc-500 uppercase font-medium mb-0.5">Calling Date</p><p className="font-semibold text-zinc-200">{detailTkt.callingDate}</p></div>
                    <div><p className="text-[11px] text-zinc-500 uppercase font-medium mb-0.5">Payment</p><p className="font-semibold text-zinc-200">{detailTkt.paymentMethod} · ₹{detailTkt.orderAmount.toLocaleString('en-IN')}</p></div>
                  </div>
                  <div><p className="text-[11px] text-zinc-500 uppercase font-medium mb-0.5">RTO Reason</p><p className="text-zinc-300">{detailTkt.rtoReason}</p></div>
                  <div><p className="text-[11px] text-zinc-500 uppercase font-medium mb-0.5">Assigned Agent</p><p className="text-indigo-400 font-medium">{detailTkt.assignedAgent}</p></div>
                  <div><p className="text-[11px] text-zinc-500 uppercase font-medium mb-0.5">Customer</p><p className="text-zinc-200 font-semibold">{detailTkt.customerName}</p><p className="text-zinc-400">{detailTkt.email} · {detailTkt.phone}</p></div>
                  <div><p className="text-[11px] text-zinc-500 uppercase font-medium mb-0.5">Address</p><p className="text-zinc-300">{detailTkt.address}</p><p className="text-zinc-200 font-medium">{detailTkt.city}, {detailTkt.state} — {detailTkt.pincode}</p></div>
                </div>
                <div className="flex items-center justify-end gap-2 px-6 py-3 border-t border-zinc-800">
                  <button onClick={()=>setDetailTkt(null)} className="px-4 py-2 rounded-lg text-[13px] text-zinc-400">Close</button>
                  <button onClick={()=>{const t=detailTkt;setDetailTkt(null);openDisp(t);}} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-[13px] font-semibold">Open Call Form</button>
                </div>
              </div>
            </Overlay>
          )}

          {/* ═══ RECEIPT MODAL ═══ */}
          {receiptTkt?.refundDetails&&(
            <Overlay onClose={()=>setReceiptTkt(null)}>
              <div className="w-full max-w-sm bg-[#111113] border border-zinc-800 rounded-2xl shadow-2xl p-6 space-y-5 text-zinc-100">
                <div className="flex items-center justify-between"><div className="flex items-center gap-2"><CheckIcon className="text-emerald-400"/><h3 className="text-base font-bold">Refund Receipt</h3></div><button onClick={()=>setReceiptTkt(null)} className="text-zinc-400"><XIcon/></button></div>
                <div id="printable-receipt" className="space-y-4">
                  <div className="text-center py-5 bg-emerald-950/20 border border-emerald-900/20 rounded-xl"><p className="text-[11px] uppercase tracking-wider text-zinc-500">Amount</p><p className="text-3xl font-extrabold text-emerald-400 mt-1">₹{receiptTkt.refundDetails.amount.toLocaleString('en-IN')}</p><p className="text-[11px] text-zinc-500 font-mono mt-1">{receiptTkt.refundDetails.transactionRef}</p></div>
                  <div className="space-y-2 text-[13px]">
                    {[['Customer',receiptTkt.customerName],['Order',receiptTkt.orderNumber],['Payment',receiptTkt.paymentMethod],['Mode',receiptTkt.refundDetails.mode],['Processed by',receiptTkt.refundDetails.processedBy],['Date',receiptTkt.refundDetails.date]].map(([k,v])=>(
                      <div key={k} className="flex justify-between"><span className="text-zinc-500">{k}</span><span className="text-zinc-200 font-medium">{v}</span></div>
                    ))}
                  </div>
                </div>
                <div className="flex items-center justify-between pt-2 border-t border-zinc-800">
                  <button onClick={()=>window.print()} className="flex items-center gap-1.5 text-[13px] text-zinc-400 hover:text-zinc-200"><PrintIcon/>Print</button>
                  <button onClick={()=>setReceiptTkt(null)} className="text-[13px] text-zinc-400">Close</button>
                </div>
              </div>
            </Overlay>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
